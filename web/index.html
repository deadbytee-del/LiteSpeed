<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="LiteSpeed: a lightweight, modular web proxy with a static frontend and a portable API backend.">
  <title>LiteSpeed</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0d'/%3E%3Cpath d='M18 4 8 18h7l-1 10 10-14h-7z' fill='%238b5cf6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="modulepreload" href="js/main.js">
</head>
<body data-view="home">
  <header class="bar">
    <a class="brand" href="./" id="brand" aria-label="LiteSpeed home">
      <svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true"><path d="M18 4 8 18h7l-1 10 10-14h-7z" fill="currentColor"/></svg>
      <span>LiteSpeed</span>
    </a>
    <div class="nav" role="group" aria-label="Navigation">
      <button class="icon" id="back" title="Back (Alt+←)" aria-label="Back"><svg viewBox="0 0 20 20"><path d="M12 4 6 10l6 6"/></svg></button>
      <button class="icon" id="forward" title="Forward (Alt+→)" aria-label="Forward"><svg viewBox="0 0 20 20"><path d="m8 4 6 6-6 6"/></svg></button>
      <button class="icon" id="reload" title="Reload" aria-label="Reload"><svg viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-2-4.5M16 3v4h-4"/></svg></button>
    </div>
    <form class="omni" id="bar-form" autocomplete="off">
      <input id="bar-input" type="text" inputmode="url" spellcheck="false" autocapitalize="off" placeholder="Search or enter address" aria-label="Address">
    </form>
    <button class="pill" id="status-pill" title="Connection status"><i class="dot"></i><span>Checking…</span></button>
    <button class="icon" id="settings-btn" title="Settings" aria-label="Settings"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg></button>
    <div class="progress" id="progress" role="progressbar" aria-hidden="true"><i></i></div>
  </header>

  <main id="home" class="home">
    <section class="hero">
      <h1>Lite<b>Speed</b></h1>
      <form class="search" id="home-form" autocomplete="off">
        <input id="home-input" type="text" inputmode="url" spellcheck="false" autocapitalize="off" autofocus placeholder="Search or enter address" aria-label="Search or enter address">
        <button type="submit">Go</button>
      </form>
      <p class="mode-note" id="mode-note"></p>
    </section>

    <div class="cols">
      <section aria-labelledby="recent-h">
        <div class="sec-head"><h2 id="recent-h">Recent</h2><button class="link" id="clear-history" hidden>Clear</button></div>
        <ul class="recent" id="recent"></ul>
        <p class="empty" id="recent-empty">Nothing yet. Destinations you visit are stored only in this browser.</p>
      </section>

      <section aria-labelledby="conn-h">
        <div class="sec-head"><h2 id="conn-h">Connection</h2><button class="link" id="recheck">Re-check</button></div>
        <dl class="kv" id="conn"></dl>
      </section>
    </div>

    <footer class="foot">
      <a href="api/">API docs</a><span>·</span>
      <a href="demo/index.html" data-demo>Static demo</a><span>·</span>
      <a href="https://github.com/deadbytee-del/LiteSpeed">Source</a>
    </footer>
  </main>

  <section id="view" class="view" hidden>
    <div class="banner" id="banner" hidden></div>
    <div class="frame-wrap">
      <iframe id="frame" title="Page" referrerpolicy="no-referrer"
        sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-pointer-lock allow-presentation"
        allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>
      <div class="err" id="err" hidden>
        <div class="err-box">
          <div class="err-code" id="err-code"></div>
          <h2 id="err-title"></h2>
          <p id="err-text"></p>
          <div class="err-actions" id="err-actions"></div>
        </div>
      </div>
    </div>
    <div class="timing" id="timing" hidden></div>
  </section>

  <dialog id="settings" aria-labelledby="settings-h"></dialog>
  <script type="module" src="js/main.js"></script>
  <noscript><p style="padding:24px">LiteSpeed needs JavaScript.</p></noscript>
</body>
</html>
